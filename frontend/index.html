<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexus RAG Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; background: #f4f6f9; color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #1e3a8a; }
    input[type="file"], input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #chatHistory { height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 5px; background: #fafafa; }
    .msg { margin-bottom: 8px; }
    .user { color: #2563eb; font-weight: bold; }
    .bot { color: #059669; font-weight: bold; }
    .status { font-size: 0.9em; color: #666; }
  
/* Formatted AI responses */
.msg {
  margin-bottom: 14px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.msg-content {
  margin-top: 6px;
  color: #263238;
}

.msg-content h1,
.msg-content h2,
.msg-content h3 {
  color: #1e3a8a;
  margin: 14px 0 6px;
  line-height: 1.3;
}

.msg-content h1 { font-size: 1.35em; }
.msg-content h2 { font-size: 1.2em; }
.msg-content h3 { font-size: 1.05em; }

.msg-content p {
  margin: 7px 0;
}

.msg-content ul,
.msg-content ol {
  padding-left: 24px;
  margin: 7px 0;
}

.msg-content li {
  margin: 4px 0;
}

.msg-content code {
  background: #eef2ff;
  padding: 2px 5px;
  border-radius: 4px;
  font-family: Consolas, monospace;
}

.msg-content pre {
  background: #f1f5f9;
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
}

.msg-content pre code {
  background: transparent;
  padding: 0;
}

.msg-content blockquote {
  border-left: 3px solid #94a3b8;
  margin: 10px 0;
  padding: 4px 12px;
  color: #475569;
}

  </style>
</head>
<body>
  <h2>🤖 Nexus RAG Document Assistant</h2>

  <!-- Upload Section -->
  <div class="card">
    <h3>1. Ingest Document</h3>
    <input type="file" id="docFile" accept=".pdf,.txt,.md" multiple>
>
    <button onclick="uploadDoc()">Upload & Index</button>
    <p id="uploadStatus" class="status"></p>
  </div>

  <!-- Chat Section -->
  <div class="card">
    <h3>2. Query Document</h3>
    <div id="chatHistory"></div>
    <input type="text" id="userInput" placeholder="Ask a question about the uploaded document...">
    <div style="display: flex; gap: 10px; margin-top: 8px;">
      <button id="sendQueryButton" onclick="sendQuery()">Send Query</button>
      <button id="clearChatButton" onclick="clearChat()" style="background: #64748b;">Clear Chat</button>
      <button id="exportChatButton" onclick="exportChat()" style="background: #0284c7;">Export Chat</button>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:5000/api";

    
    async function uploadDoc() {
      const input = document.getElementById("docFile");
      const files = Array.from(input.files);
      const status = document.getElementById("uploadStatus");

      if (files.length === 0) {
        status.textContent = "Please select at least one document.";
        return;
      }

      const allowedExtensions = [".pdf", ".txt", ".md"];
      const invalidFiles = files.filter(file =>
        !allowedExtensions.some(ext =>
          file.name.toLowerCase().endsWith(ext)
        )
      );

      if (invalidFiles.length > 0) {
        status.textContent =
          "Unsupported file(s): " +
          invalidFiles.map(file => file.name).join(", ");
        return;
      }

      const uploadButton = document.querySelector(
        'button[onclick="uploadDoc()"]'
      );

      uploadButton.disabled = true;

      const results = [];

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];

          status.textContent =
            `Uploading ${i + 1} of ${files.length}: ${file.name}`;

          const formData = new FormData();

          // Keep "file" because the existing Flask endpoint expects it.
          formData.append("file", file);

          const response = await fetch(`${API}/upload`, {
            method: "POST",
            body: formData
          });

          const data = await response.json();

          if (!response.ok) {
            results.push(`❌ ${file.name}: ${data.error || "Upload failed"}`);
          } else {
            results.push(`✅ ${file.name}: Indexed successfully`);
          }
        }

        status.textContent = results.join("\n");
        status.style.whiteSpace = "pre-line";

        // Allow the same files to be selected again if needed.
        input.value = "";
      } catch (error) {
        status.textContent =
          "Connection error. Check whether the backend is running.\n" +
          results.join("\n");
      } finally {
        uploadButton.disabled = false;
      }
    }


    
function appendInlineMarkdown(parent, text) {
  const pattern = /(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g;
  let lastIndex = 0;
  let match;

  while ((match = pattern.exec(text)) !== null) {
    if (match.index > lastIndex) {
      parent.appendChild(
        document.createTextNode(text.slice(lastIndex, match.index))
      );
    }

    const token = match[0];
    let element;

    if (token.startsWith("**")) {
      element = document.createElement("strong");
      element.textContent = token.slice(2, -2);
    } else if (token.startsWith("`")) {
      element = document.createElement("code");
      element.textContent = token.slice(1, -1);
    } else {
      element = document.createElement("em");
      element.textContent = token.slice(1, -1);
    }

    parent.appendChild(element);
    lastIndex = pattern.lastIndex;
  }

  if (lastIndex < text.length) {
    parent.appendChild(
      document.createTextNode(text.slice(lastIndex))
    );
  }
}

function renderMarkdown(container, markdown) {
  const lines = String(markdown ?? "").replace(/\r/g, "").split("\n");

  let paragraph = [];
  let list = null;
  let codeLines = [];
  let inCode = false;
  let quoteLines = [];

  function addParagraph() {
    if (!paragraph.length) return;

    const p = document.createElement("p");
    appendInlineMarkdown(p, paragraph.join(" "));
    container.appendChild(p);
    paragraph = [];
  }

  function closeList() {
    list = null;
  }

  function addQuote() {
    if (!quoteLines.length) return;

    addParagraph();
    closeList();

    const quote = document.createElement("blockquote");
    appendInlineMarkdown(quote, quoteLines.join(" "));
    container.appendChild(quote);
    quoteLines = [];
  }

  function addCode() {
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.textContent = codeLines.join("\n");
    pre.appendChild(code);
    container.appendChild(pre);
    codeLines = [];
  }

  for (const line of lines) {
    if (line.trim().startsWith("```")) {
      addParagraph();
      closeList();
      addQuote();

      if (inCode) {
        addCode();
        inCode = false;
      } else {
        inCode = true;
      }
      continue;
    }

    if (inCode) {
      codeLines.push(line);
      continue;
    }

    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    const bullet = line.match(/^\s*[-*+]\s+(.+)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);
    const quote = line.match(/^\s*>\s?(.*)$/);

    if (quote) {
      addParagraph();
      closeList();
      quoteLines.push(quote[1]);
      continue;
    } else {
      addQuote();
    }

    if (heading) {
      addParagraph();
      closeList();

      const h = document.createElement(`h${heading[1].length}`);
      appendInlineMarkdown(h, heading[2]);
      container.appendChild(h);
    } else if (bullet || numbered) {
      addParagraph();

      const tag = bullet ? "ul" : "ol";
      if (!list || list.tagName.toLowerCase() !== tag) {
        closeList();
        list = document.createElement(tag);
        container.appendChild(list);
      }

      const li = document.createElement("li");
      appendInlineMarkdown(li, (bullet || numbered)[1]);
      list.appendChild(li);
    } else if (!line.trim()) {
      addParagraph();
      closeList();
    } else {
      closeList();
      paragraph.push(line.trim());
    }
  }

  addParagraph();
  addQuote();

  if (inCode) addCode();
}

function appendMessage(history, className, label, text) {
  const message = document.createElement("div");
  message.className = "msg";

  const prefix = document.createElement("span");
  prefix.className = className;
  prefix.textContent = `${label}:`;

  message.appendChild(prefix);

  if (className === "bot") {
    const content = document.createElement("div");
    content.className = "msg-content";
    renderMarkdown(content, text);
    message.appendChild(content);
  } else {
    message.appendChild(
      document.createTextNode(` ${text}`)
    );
  }

  history.appendChild(message);
}


    async function sendQuery() {
      const input = document.getElementById("userInput");
      const query = input.value.trim();
      if (!query) return;

      const history = document.getElementById("chatHistory");
      const sendButton = document.getElementById("sendQueryButton");
      appendMessage(history, "user", "You", query);
      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      try {
        const res = await fetch(`${API}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query, session_id: "demo_session" })
        });
        const data = await res.json();
        const reply = res.ok
          ? data.response || "Unexpected server response."
          : data.error || `Request failed (${res.status}).`;
        appendMessage(history, "bot", "AI", reply);
      } catch (err) {
        appendMessage(history, "bot", "AI", "Error reaching backend.");
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
        history.scrollTop = history.scrollHeight;
      }
    }

    document.getElementById("userInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendQuery();
    });

    async function clearChat() {
      try {
        await fetch(`${API}/clear-history`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: "demo_session" })
        });
        document.getElementById("chatHistory").innerHTML = `<div class="msg" style="color: #666;"><em>Conversation history cleared.</em></div>`;
      } catch (err) {
        alert("Failed to clear chat history.");
      }
    }

    async function exportChat() {
      try {
        const res = await fetch(`${API}/export-chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: "demo_session" })
        });
        const data = await res.json();
        const blob = new Blob([data.transcript || "No transcript available."], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `nexus_chat_transcript_${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Failed to export chat transcript.");
      }
    }
  </script>
</body>
</html>
